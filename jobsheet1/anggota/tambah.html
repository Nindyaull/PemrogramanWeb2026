<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>SIMPUS-Mini | Tambah Anggota</title>
</head>

<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html">Daftar Buku</a></li>
                <li><a href="../buku/tambah.html">Tambah Buku</a></li>
                <li><a href="list.html">Daftar Anggota</a></li>
                <li><a href="tambah.html">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form>
            <p>
                <label for="no_anggota">No. Anggota</label><br>
                <input type="text" id="no_anggota" name="no_anggota" required>
            </p>
            <p>
                <label for="nama">Nama</label><br>
                <input type="text" id="nama" name="nama" required>
            </p>
            <p>
                <label for="gender">Jenis Kelamin</label><br>
                <select name="gender" id="gender">
                    <option value="woman">Perempuan</option>
                    <option value="man">Laki-Laki</option>
                </select>
            </p>
            <p>
                <label for="status">Status Keanggotaan</label><br>
                <select name="status" id="status">
                    <option value="pelajar">Mahasiswa</option>
                    <option value="dosen">Dosen</option>
                    <option value="umum">Umum</option>
                </select>
            </p>
            <p>
                <label for="alamat">Alamat</label><br>
                <input type="text" id="alamat" name="alamat">
            </p>
            <p>
                <label for="no_hp">No. HP</label><br>
                <input type="text" id="no_hp" name="no_hp">
            </p>
            <p>
                <label for="email">Alamat Email</label><br>
                <input type="email" id="email" name="email">
            </p>
            <p>
                <button type="submit">Simpan</button>
            </p>
        </form>
    </main><br>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
    </footer>
</body>

</html>
